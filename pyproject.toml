[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "longdiar"
version = "0.1.0"
description = "Post-FrankenWhisper diarization for long (>2 h) / many-speaker (>4) audio"
requires-python = ">=3.10"
dependencies = ["numpy==2.5.3", "onnxruntime==1.30.0"]

[project.scripts]
longdiar = "longdiar.__main__:main"

[tool.setuptools]
packages = ["longdiar"]
